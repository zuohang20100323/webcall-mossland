<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>语音通话 - Y2K Nokia</title>
    <style>
        /* ================= 全局与环境 ================= */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            /* 模拟深色的桌面背景，突出手机 */
            background: radial-gradient(circle at center, #4b5563 0%, #111827 100%);
            font-family: "Courier New", SimSun, monospace; /* 使用等宽和宋体模拟像素像素字体 */
            -webkit-font-smoothing: none; /* 关闭抗锯齿，增强像素复古感 */
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        /* ================= 手机外壳 (物理机身) ================= */
        .app-container {
            /* 手机外壳的银灰色塑料质感 */
            background: linear-gradient(145deg, #d4d8db 0%, #8b939a 100%);
            width: 100%;
            max-width: 380px; /* 调整为更接近手机的比例 */
            height: 90vh;
            max-height: 800px;
            border-radius: 40px 40px 50px 50px; /* 顶部略平，底部圆润 */
            position: relative;
            display: flex;
            flex-direction: column;
            /* 手机厚度和立体阴影 */
            box-shadow: 
                inset 4px 4px 10px rgba(255, 255, 255, 0.7),
                inset -6px -6px 15px rgba(0, 0, 0, 0.4),
                15px 20px 35px rgba(0, 0, 0, 0.6),
                0 0 0 2px #5a6268;
            border: 1px solid #e2e6e9;
            padding: 20px 15px 30px 15px;
            overflow: hidden;
        }

        /* 听筒 (Earpiece) */
        .speaker-grill {
            display: flex;
            justify-content: center;
            gap: 6px;
            margin-bottom: 25px;
            margin-top: 10px;
        }
        .speaker-grill span {
            width: 16px;
            height: 4px;
            background: #111;
            border-radius: 2px;
            box-shadow: inset 0 2px 3px rgba(0,0,0,0.8), 0 1px 1px rgba(255,255,255,0.4);
        }

        /* ================= 视图容器 ================= */
        .view {
            display: none;
            flex-direction: column;
            flex: 1;
            position: relative;
        }
        .view.active { display: flex; }

        /* ================= 屏幕区域 (LCD Screen) ================= */
        .phone-screen-frame {
            /* 屏幕黑色边框 */
            background: #2a2c2f;
            border-radius: 15px;
            padding: 15px 20px 25px 20px;
            margin: 0 10px;
            box-shadow: 
                inset 0 4px 10px rgba(0,0,0,0.8),
                0 2px 2px rgba(255,255,255,0.4);
            position: relative;
            z-index: 10;
        }
        /* Nokia Logo 占位 */
        .phone-screen-frame::after {
            content: "NOKIA";
            position: absolute;
            bottom: 6px;
            left: 50%;
            transform: translateX(-50%);
            color: #7d848a;
            font-family: "Arial Black", sans-serif;
            font-size: 11px;
            letter-spacing: 3px;
            text-shadow: 0 -1px 1px #000;
        }

        .phone-screen {
            /* 经典的诺基亚原谅绿 LCD 背景 */
            background: #849c29;
            height: 220px;
            border-radius: 2px;
            box-shadow: 
                inset 2px 2px 8px rgba(0,0,0,0.5),
                inset -1px -1px 4px rgba(255,255,255,0.2);
            border: 1px solid #1a2407;
            position: relative;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            /* 屏幕内容颜色和像素阴影 */
            color: #1a2407;
            text-shadow: 1px 1px 0px rgba(132, 156, 41, 0.4);
        }

        /* LCD 像素网格叠加层 (模拟真实点阵屏) */
        .phone-screen::before {
            content: "";
            position: absolute;
            inset: 0;
            background: linear-gradient(rgba(26, 36, 7, 0.05) 50%, transparent 50%),
                        linear-gradient(90deg, rgba(26, 36, 7, 0.05) 50%, transparent 50%);
            background-size: 3px 3px;
            pointer-events: none;
            z-index: 50;
        }

        /* 屏幕反光玻璃特效 */
        .phone-screen-glass {
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, rgba(255,255,255,0.2) 0%, rgba(255,255,255,0) 40%);
            pointer-events: none;
            z-index: 51;
        }

        /* 顶部状态栏 (伪造的信号和电量) */
        .nokia-status-bar {
            display: flex;
            justify-content: space-between;
            padding: 4px 6px;
            font-size: 12px;
            font-weight: bold;
            border-bottom: 2px solid #1a2407;
            margin-bottom: 4px;
        }

        /* ================= 拨号视图专属 ================= */
        .dial-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        .dial-name { font-size: 24px; font-weight: bold; }
        #hint { font-size: 12px; font-weight: bold; }

        /* ================= 通话视图专属 ================= */
        .call-body {
            flex: 1;
            display: flex;
            flex-direction: column;
            position: relative;
            z-index: 5;
            padding: 0 10px;
        }
        .call-header-area {
            text-align: center;
            margin-top: 5px;
            border-bottom: 1px dashed #1a2407;
            padding-bottom: 5px;
        }
        .call-name { font-size: 20px; font-weight: bold; }
        .call-status-area {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 6px;
            font-size: 12px;
            font-weight: bold;
            margin-top: 4px;
        }
        #connDot {
            width: 8px; height: 8px;
            background: #1a2407; /* 连接点变成纯黑 */
            display: none;
            animation: blink 1s infinite;
        }
        @keyframes blink { 0%, 100%{opacity:1} 50%{opacity:0} }

        .subtitle-area {
            flex: 1;
            overflow-y: auto;
            padding: 5px 0;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            gap: 8px;
            scrollbar-width: none; /* 隐藏滚动条 */
        }
        .subtitle-area::-webkit-scrollbar { display: none; }
        
        #userSubtitle {
            font-size: 12px;
            text-align: right;
            font-weight: bold;
        }
        #userSubtitle::before { content: "我: "; }
        #aiSubtitle {
            font-size: 16px;
            font-weight: bold;
            text-align: left;
            border-left: 3px solid #1a2407;
            padding-left: 5px;
        }
        #statusLine, #statsLine {
            font-size: 10px;
            text-align: center;
        }

        /* 文字输入区 (嵌入在LCD底部) */
        #textInputArea {
            display: none; /* 默认隐藏 */
            background: #1a2407;
            padding: 4px;
            display: flex;
            gap: 4px;
            position: relative;
            z-index: 20;
        }
        #textInput {
            flex: 1;
            background: #849c29;
            border: 2px inset #1a2407;
            color: #1a2407;
            font-family: inherit;
            font-size: 12px;
            font-weight: bold;
            padding: 4px;
            outline: none;
        }
        #textInput::placeholder { color: #4a5c17; }
        .btn-send {
            background: transparent;
            border: 2px solid #849c29;
            color: #849c29;
            font-family: inherit;
            font-weight: bold;
            padding: 0 8px;
            cursor: pointer;
        }
        .btn-send:active { background: #849c29; color: #1a2407; }

        /* 屏幕底部软键标签 */
        .soft-key-labels {
            display: flex;
            justify-content: space-between;
            padding: 2px 6px;
            font-size: 12px;
            font-weight: bold;
            background: #849c29;
            border-top: 1px solid #1a2407;
            z-index: 5;
        }

        /* ================= 物理键盘区域 (Keypad) ================= */
        .phone-keypad {
            flex: 1;
            padding: 15px 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            position: relative;
            z-index: 20;
        }

        /* 物理按键基础样式 */
        .physical-btn {
            background: linear-gradient(180deg, #e4e7eb 0%, #aeb4ba 100%);
            border: 1px solid #777c82;
            border-radius: 12px 12px 20px 20px;
            box-shadow: 
                inset 0 3px 5px rgba(255,255,255,0.9),
                inset 0 -3px 5px rgba(0,0,0,0.2),
                0 6px 8px rgba(0,0,0,0.5),
                0 2px 2px rgba(0,0,0,0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            position: relative;
            transition: all 0.1s;
            color: #333;
            -webkit-tap-highlight-color: transparent;
        }
        .physical-btn:active {
            background: linear-gradient(180deg, #aeb4ba 0%, #e4e7eb 100%);
            box-shadow: 
                inset 0 3px 6px rgba(0,0,0,0.4),
                0 1px 1px rgba(0,0,0,0.2);
            transform: translateY(4px);
        }
        .physical-btn svg {
            width: 20px; height: 20px;
            fill: #333;
            filter: drop-shadow(0 1px 1px rgba(255,255,255,0.6));
        }

        /* 导航簇 (左右软键 + 中间方向键) */
        .nav-cluster {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-top: -5px;
        }
        .soft-btn {
            width: 55px; height: 35px;
            border-radius: 20px 20px 10px 10px; /* 特殊倾斜角 */
        }
        .soft-btn .btn-mark {
            width: 20px; height: 4px;
            background: #888;
            border-radius: 2px;
            box-shadow: inset 0 1px 2px rgba(0,0,0,0.3), 0 1px 1px rgba(255,255,255,0.5);
        }

        /* 假的十字方向键（装饰用） */
        .directional-pad {
            width: 60px; height: 60px;
            background: linear-gradient(135deg, #d0d4d8 0%, #9aa0a6 100%);
            border-radius: 50%;
            border: 2px solid #6b7278;
            box-shadow: 
                inset 0 2px 4px rgba(255,255,255,0.8),
                0 5px 10px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: 5px;
        }
        .directional-pad::after {
            content: "";
            width: 24px; height: 24px;
            background: #111;
            border-radius: 50%;
            box-shadow: inset 0 2px 5px rgba(255,255,255,0.3);
            margin: auto;
        }

        /* 功能控制栏 (Mute, Hangup, Speaker) */
        .call-controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 10px;
        }
        .ctrl-btn {
            width: 60px; height: 35px;
        }

        /* 绿色拨号键与红色挂断键 */
        .green-btn {
            background: linear-gradient(180deg, #9ccc65 0%, #558b2f 100%);
            border-color: #33691e;
        }
        .green-btn:active { background: linear-gradient(180deg, #558b2f 0%, #9ccc65 100%); }
        .green-btn svg { fill: #fff; filter: drop-shadow(0 -1px 1px rgba(0,0,0,0.5)); }

        .red-btn {
            background: linear-gradient(180deg, #ef5350 0%, #c62828 100%);
            border-color: #b71c1c;
        }
        .red-btn:active { background: linear-gradient(180deg, #c62828 0%, #ef5350 100%); }
        .red-btn svg { fill: #fff; filter: drop-shadow(0 -1px 1px rgba(0,0,0,0.5)); transform: rotate(135deg); } /* 挂断图标旋转 */

        /* 伪数字键盘 (增强真实感) */
        .fake-numpad {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px 15px;
            padding: 0 10px;
            margin-top: 5px;
        }
        .num-key {
            background: linear-gradient(180deg, #e4e7eb 0%, #aeb4ba 100%);
            border: 1px solid #777c82;
            border-radius: 12px 12px 18px 18px;
            box-shadow: 
                inset 0 2px 4px rgba(255,255,255,0.9),
                inset 0 -2px 3px rgba(0,0,0,0.2),
                0 4px 6px rgba(0,0,0,0.5);
            height: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            font-weight: 900;
            color: #333;
            position: relative;
        }
        .num-key span {
            font-size: 8px;
            position: absolute;
            bottom: 2px;
            right: 6px;
            color: #555;
            letter-spacing: -0.5px;
        }
        .num-key:active { transform: translateY(3px); box-shadow: 0 1px 1px rgba(0,0,0,0.4); }

        /* ================= 设置面板 (复古 BIOS/LCD 风格) ================= */
        .settings-overlay {
            display: none;
            position: absolute;
            inset: 0;
            background: rgba(0,0,0,0.6); /* 半透黑底 */
            z-index: 1000;
            justify-content: center;
            align-items: center;
            opacity: 0;
            transition: opacity 0.2s;
            padding: 20px;
        }
        .settings-overlay.active { display: flex; opacity: 1; }
        
        .settings-panel {
            background: #849c29; /* 覆盖LCD原谅绿 */
            border: 4px inset #1a2407;
            width: 100%;
            height: 95%;
            overflow-y: auto;
            padding: 15px;
            color: #1a2407;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
            scrollbar-width: none;
        }
        .settings-panel::-webkit-scrollbar { display: none; }

        .settings-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 3px double #1a2407;
            padding-bottom: 10px;
            margin-bottom: 15px;
        }
        .settings-title { font-size: 18px; font-weight: bold; }
        .btn-settings-close {
            background: #1a2407;
            color: #849c29;
            border: none;
            padding: 2px 8px;
            font-family: inherit;
            font-weight: bold;
            cursor: pointer;
        }
        .btn-settings-close:active { background: transparent; color: #1a2407; border: 2px solid #1a2407; }

        .settings-section-title {
            font-weight: bold;
            text-transform: uppercase;
            margin-bottom: 5px;
            background: #1a2407;
            color: #849c29;
            display: inline-block;
            padding: 2px 5px;
        }
        .settings-field { margin-bottom: 10px; }
        .settings-field label { display: block; font-weight: bold; margin-bottom: 4px; }
        .settings-field input, .settings-field select, .settings-field textarea {
            width: 100%;
            background: transparent;
            border: 2px solid #1a2407;
            color: #1a2407;
            font-family: inherit;
            font-weight: bold;
            padding: 6px;
            outline: none;
        }
        .settings-field input:focus, .settings-field textarea:focus { background: rgba(26, 36, 7, 0.1); }
        .settings-hint { font-size: 10px; font-weight: bold; margin-bottom: 15px; border-left: 2px solid #1a2407; padding-left: 5px; }
        
        .btn-settings-save {
            width: 100%;
            background: #1a2407;
            color: #849c29;
            border: 2px solid #1a2407;
            padding: 10px;
            font-size: 16px;
            font-weight: bold;
            font-family: inherit;
            cursor: pointer;
            margin-top: 10px;
        }
        .btn-settings-save:active { background: transparent; color: #1a2407; }

        /* 日志区域 */
        .log-content {
            background: rgba(26, 36, 7, 0.2);
            border: 2px inset #1a2407;
            height: 100px;
            overflow-y: auto;
            padding: 5px;
            font-size: 10px;
            font-weight: bold;
        }
        .log-actions { display: flex; gap: 5px; margin-top: 5px; }
        .log-actions button {
            flex: 1; background: #1a2407; color: #849c29; border: none; padding: 5px; font-family: inherit; font-weight: bold;
        }

        /* 静音图标逻辑适配 */
        #btnMute .icon-mic-off { display: none; }
        #btnMute.active .icon-mic { display: none; }
        #btnMute.active .icon-mic-off { display: block; }
        
    </style>
</head>
<body>
    
<div class="app-container">
    <!-- 物理听筒 -->
    <div class="speaker-grill"><span></span><span></span><span></span></div>

    <!-- ================= 拨号视图 ================= -->
    <div id="viewDial" class="view active">
        <!-- 屏幕外框 -->
        <div class="phone-screen-frame">
            <div class="phone-screen">
                <div class="phone-screen-glass"></div>
                <!-- Y2K 状态栏 -->
                <div class="nokia-status-bar">
                    <span class="signal">Yll</span>
                    <span class="battery">[|||]</span>
                </div>
                <!-- 屏幕主体 -->
                <div class="dial-content">
                    <div class="dial-name">{{ character_name }}</div>
                    <div id="hint">点击下方绿键呼叫</div>
                </div>
                <!-- 底部软键标签 -->
                <div class="soft-key-labels">
                    <span>名片</span>
                    <span>设置</span>
                </div>
            </div>
        </div>

        <!-- 物理键盘区 -->
        <div class="phone-keypad">
            <div class="nav-cluster">
                <!-- 占位软键 -->
                <button class="physical-btn soft-btn" style="visibility:hidden;"></button>
                <div class="directional-pad"></div>
                <!-- 右软键：设置 -->
                <button class="btn-settings physical-btn soft-btn" onclick="openSettings()">
                    <div class="btn-mark"></div>
                </button>
            </div>
            
            <div class="call-controls" style="justify-content: center;">
                <!-- 巨型拨号绿键 (绑定了ID和原逻辑) -->
                <button class="physical-btn green-btn" style="width: 80px; height: 45px; border-radius: 25px;" id="btnCall" onclick="startCall()">
                    <svg viewBox="0 0 24 24">
                        <path d="M20.01 15.38c-1.23 0-2.42-.2-3.53-.56-.35-.12-.74-.03-1.01.24l-1.57 1.97c-2.83-1.35-5.48-3.9-6.89-6.83l1.95-1.66c.27-.28.35-.67.24-1.02-.37-1.11-.56-2.3-.56-3.53 0-.54-.45-.99-.99-.99H4.19C3.65 3 3 3.24 3 3.99 3 13.28 10.73 21 20.01 21c.71 0 .99-.63.99-1.18v-3.45c0-.54-.45-.99-.99-.99z"/>
                    </svg>
                </button>
            </div>
            
            <!-- 装饰用数字键 -->
            <div class="fake-numpad">
                <div class="num-key">1</div><div class="num-key">2<span>abc</span></div><div class="num-key">3<span>def</span></div>
                <div class="num-key">4<span>ghi</span></div><div class="num-key">5<span>jkl</span></div><div class="num-key">6<span>mno</span></div>
                <div class="num-key">7<span>pqrs</span></div><div class="num-key">8<span>tuv</span></div><div class="num-key">9<span>wxyz</span></div>
                <div class="num-key">*</div><div class="num-key">0</div><div class="num-key">#</div>
            </div>
        </div>
    </div>

    <!-- ================= 通话中视图 ================= -->
    <div id="viewCall" class="view">
        <!-- 屏幕外框 -->
        <div class="phone-screen-frame">
            <div class="phone-screen">
                <div class="phone-screen-glass"></div>
                <div class="nokia-status-bar">
                    <span class="signal">Yll</span>
                    <span class="battery">[|||]</span>
                </div>
                <!-- 通话内容区 -->
                <div class="call-body">
                    <div class="call-header-area">
                        <div class="call-name">{{ character_name }}</div>
                        <div class="call-status-area">
                            <div id="connDot"></div>
                            <span id="callStatus">正在连接…</span>
                            <span id="callTimer">00:00</span>
                        </div>
                    </div>

                    <div class="subtitle-area">
                        <div id="userSubtitle"></div>
                        <div id="aiSubtitle"></div>
                        <div id="statusLine"></div>
                        <div id="statsLine"></div>
                    </div>
                </div>

                <!-- 文本输入区包裹在屏幕底部 -->
                <div id="textInputArea" style="display:flex;">
                    <input type="text" id="textInput" placeholder="输入文字..." autocomplete="off" />
                    <button class="btn-send" onclick="sendTextInput()">发送</button>
                </div>

                <!-- 屏幕软键对应标签 -->
                <div class="soft-key-labels">
                    <span>返回</span>
                    <span>设置</span>
                </div>
            </div>
        </div>

        <!-- 物理键盘区 -->
        <div class="phone-keypad">
            <!-- 导航与软键排 -->
            <div class="nav-cluster">
                <!-- 左软键：返回 -->
                <button class="btn-back physical-btn soft-btn" id="btnBack" onclick="if(isInCall){toggleCall()}else{switchView('dial')}">
                    <div class="btn-mark"></div>
                </button>
                <div class="directional-pad"></div>
                <!-- 右软键：设置 -->
                <button class="btn-settings physical-btn soft-btn" onclick="openSettings()">
                    <div class="btn-mark"></div>
                </button>
            </div>

            <!-- 控制排：静音、挂断、免提 -->
            <div class="call-controls">
                <button class="ctrl-btn physical-btn" id="btnMute" onclick="toggleMute()">
                    <svg class="icon-mic" viewBox="0 0 24 24"><path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z"/><path d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/></svg>
                    <svg class="icon-mic-off" viewBox="0 0 24 24"><path d="M19 11c0 .73-.13 1.43-.37 2.09l1.53 1.53C20.69 13.51 21 12.29 21 11h-2zM4.27 3L3 4.27l6 6V11c0 1.66 1.34 3 3 3 .23 0 .44-.03.65-.08l1.66 1.66c-.71.33-1.5.52-2.31.52-2.76 0-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c1.37-.2 2.63-.82 3.65-1.68l2.08 2.08 1.27-1.27L4.27 3zM12 4c-1.66 0-3 1.34-3 3v.18l7 7V7c0-1.66-1.34-3-3-3z"/></svg>
                </button>
                <!-- 红色挂断键 -->
                <button class="ctrl-btn ctrl-btn-hangup physical-btn red-btn" id="btnHangup" onclick="toggleCall()">
                    <svg viewBox="0 0 24 24"><path d="M20.01 15.38c-1.23 0-2.42-.2-3.53-.56-.35-.12-.74-.03-1.01.24l-1.57 1.97c-2.83-1.35-5.48-3.9-6.89-6.83l1.95-1.66c.27-.28.35-.67.24-1.02-.37-1.11-.56-2.3-.56-3.53 0-.54-.45-.99-.99-.99H4.19C3.65 3 3 3.24 3 3.99 3 13.28 10.73 21 20.01 21c.71 0 .99-.63.99-1.18v-3.45c0-.54-.45-.99-.99-.99z"/></svg>
                </button>
                <!-- 免提 -->
                <button class="ctrl-btn physical-btn" id="btnSpeaker" onclick="toggleSpeaker()">
                    <svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>
                </button>
            </div>

            <div class="fake-numpad">
                <div class="num-key">1</div><div class="num-key">2<span>abc</span></div><div class="num-key">3<span>def</span></div>
                <div class="num-key">4<span>ghi</span></div><div class="num-key">5<span>jkl</span></div><div class="num-key">6<span>mno</span></div>
                <div class="num-key">7<span>pqrs</span></div><div class="num-key">8<span>tuv</span></div><div class="num-key">9<span>wxyz</span></div>
                <div class="num-key">*</div><div class="num-key">0</div><div class="num-key">#</div>
            </div>
        </div>
    </div>

    <!-- ================= 设置弹窗 (复古 BIOS 菜单) ================= -->
    <div class="settings-overlay" id="settingsOverlay" onclick="if(event.target===this)closeSettings()">
        <div class="settings-panel">
            <div class="settings-header">
                <div class="settings-title">SYS MENU</div>
                <button class="btn-settings-close" onclick="closeSettings()">[X]</button>
            </div>

            <!-- 主题切换 -->
            <div class="settings-section">
                <div class="settings-section-title">THEME UI</div>
                <div style="display:flex; gap: 5px; margin-bottom: 5px;">
                    <button class="theme-btn" data-theme-val="ios" onclick="setTheme('ios')" style="flex:1; padding:8px; background:transparent; border:2px solid #1a2407; color:#1a2407; font-weight:bold; cursor:pointer;">IOS</button>
                    <button class="theme-btn" data-theme-val="y2k" onclick="setTheme('y2k')" style="flex:1; padding:8px; background:#1a2407; border:2px solid #1a2407; color:#849c29; font-weight:bold; cursor:pointer;">Y2K</button>
                </div>
            </div>

            <div class="settings-section">
                <div class="settings-section-title">BUILT-IN MODEL</div>
                <div class="settings-field">
                    <select id="settingsBuiltinModel">
                        <option value="" disabled selected>CLICK TO LOAD</option>
                    </select>
                </div>
            </div>

            <div class="settings-section">
                <div class="settings-section-title">PREF & ROLE</div>
                <div class="settings-field">
                    <label>SYS INFO:</label>
                    <textarea id="settingsUserInfo" placeholder="Personality..."></textarea>
                </div>
                <div class="settings-field">
                    <label>TOPIC:</label>
                    <input type="text" id="settingsTopic" placeholder="Topic...">
                </div>
                <div class="settings-field">
                    <label>PROMPT:</label>
                    <textarea id="settingsExtraPrompt" placeholder="Extra rules..."></textarea>
                </div>
            </div>

            <div class="settings-section">
                <div class="settings-section-title">MEMORY</div>
                <div class="settings-field">
                    <label>HISTORY ROUNDS (1-100):</label>
                    <input type="number" id="settingsMaxHistory" min="1" max="100" value="20">
                </div>
            </div>

            <div class="settings-section">
                <div class="settings-section-title">CUSTOM LLM API</div>
                <div class="settings-field">
                    <input type="url" id="settingsLlmUrl" placeholder="URL (HTTPS)">
                </div>
                <div class="settings-field">
                    <input type="password" id="settingsLlmKey" placeholder="KEY (SK-...)">
                </div>
                <div class="settings-field" style="display:flex; gap: 5px;">
                    <input type="text" id="settingsLlmModel" placeholder="MODEL" style="flex:1;">
                    <button onclick="settingsFetchLlmModels()" style="background:#1a2407; color:#849c29; border:none; padding:0 10px; font-weight:bold; cursor:pointer;">GET</button>
                </div>
                <div id="settingsLlmModelError" style="color:#000; font-size:12px; margin-top:5px; display:none; border: 1px dashed #1a2407; padding: 2px;"></div>
            </div>

            <div class="settings-section">
                <div class="settings-section-title">MINIMAX TTS</div>
                <div class="settings-field">
                    <input type="password" id="settingsTtsKey" placeholder="API KEY">
                </div>
                <div class="settings-field">
                    <input type="text" id="settingsTtsGroupId" placeholder="GROUP ID">
                </div>
                <div class="settings-field">
                    <input type="text" id="settingsTtsVoiceId" placeholder="VOICE ID">
                </div>
                <div class="settings-field">
                    <select id="settingsTtsModel">
                        <option value="speech-2.8-hd">speech-2.8-hd</option>
                        <option value="speech-2.8-turbo">speech-2.8-turbo</option>
                        <option value="speech-02-hd">speech-02-hd</option>
                        <option value="speech-02">speech-02</option>
                    </select>
                </div>
            </div>

            <button class="btn-settings-save" onclick="saveSettings()">SAVE & APPLY</button>

            <div class="settings-section" style="margin-top:20px">
                <div class="settings-section-title">SYSTEM LOG</div>
                <div class="log-content" id="logContent"></div>
                <div class="log-actions">
                    <button onclick="copyLog()">COPY</button>
                    <button onclick="clearLog()">CLR</button>
                </div>
            </div>
        </div>
    </div>

</div>

    <script>
      // Expose character name for static JS
      window.CHARACTER_NAME = {{ character_name|tojson }};
    </script>
    <script src="/static/call.js"></script>
</body>
</html>
