<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>语音通话</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body {
  min-height: 100%;
  background: #1a2a3a;
  font-family: "Courier New", "Nokia Sans", monospace;
  -webkit-font-smoothing: antialiased;
}
.app-container {
  background: #2b3a4a;
  width: 100%;
  max-width: 480px;
  min-height: 100vh;
  margin: 0 auto;
  display: flex;
  flex-direction: column;
  box-shadow: 0 0 20px rgba(0,0,0,0.2);
}
.content {
  flex: 1;
  padding: 0 20px;
  display: flex;
  flex-direction: column;
  margin-top: 80px;
}
.large-title {
  font-size: 28px;
  font-weight: 700;
  color: #e0f0e8;
  line-height: 1.2;
  margin-bottom: 8px;
}
.subtitle {
  font-size: 15px;
  color: #8ab8a0;
  margin-bottom: 32px;
}
.section-title {
  font-size: 13px;
  font-weight: 600;
  color: #8ab8a0;
  text-transform: uppercase;
  letter-spacing: 0.5px;
  margin-bottom: 8px;
}
.ios-input-group {
  background: #263848;
  border-radius: 4px;
  padding: 4px 16px;
  margin-bottom: 12px;
  border: 1px solid #4a7a6a;
}
.input-field {
  width: 100%;
  height: 44px;
  border: none;
  background: transparent;
  font-size: 17px;
  color: #e0f0e8;
  outline: none;
  font-family: inherit;
}
.input-field::placeholder { color: #6a9a8a; }
.btn-primary {
  width: 100%;
  height: 50px;
  background: #4caf50;
  color: #fff;
  border: none;
  border-radius: 4px;
  font-size: 17px;
  font-weight: 600;
  cursor: pointer;
  transition: opacity 0.2s;
  font-family: inherit;
}
.btn-primary:active { opacity: 0.5; }
.btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }
.btn-green { background: #4caf50; }
.error-msg {
  color: #e53935;
  font-size: 13px;
  margin-top: 8px;
  text-align: center;
  min-height: 18px;
}
.divider {
  display: flex;
  align-items: center;
  margin: 28px 0;
  gap: 12px;
}
.divider::before, .divider::after {
  content: '';
  flex: 1;
  height: 0.5px;
  background: #4a7a6a;
}
.divider span {
  font-size: 13px;
  color: #8ab8a0;
  text-transform: uppercase;
}
.auth-toggle {
  text-align: center;
  margin-top: 12px;
}
.auth-toggle a {
  color: #42a5f5;
  font-size: 15px;
  cursor: pointer;
  text-decoration: none;
}
.auth-toggle a:active { opacity: 0.5; }
.footer {
  text-align: center;
  font-size: 13px;
  color: #8ab8a0;
  margin-top: auto;
  margin-bottom: 40px;
  padding-top: 24px;
}
.footer a {
  color: #e0f0e8;
  font-weight: 500;
  text-decoration: none;
}
.hint {
  font-size: 13px;
  color: #8ab8a0;
  margin-top: 8px;
  text-align: center;
}
</style>
</head>
<body>

<div class="app-container">
  <div class="content">
    <div class="large-title">给{{ character_name }}打<br>一通电话吧</div>
    <div class="subtitle">输入口令体验，或登录账号</div>

    <!-- 口令体验区 -->
    <div class="section-title">口令体验</div>
    <div class="ios-input-group">
      <input class="input-field" id="redeemInput" type="text" placeholder="输入口令" autocomplete="off" autocorrect="off">
    </div>
    <button class="btn-primary btn-green" id="redeemBtn" onclick="doRedeem()">开始体验</button>
    <div class="error-msg" id="redeemError"></div>
    <div class="hint">从小红书获取口令，免费体验</div>

    <div class="divider"><span>或</span></div>

    <!-- 账号登录区 -->
    <div class="section-title">账号登录</div>
    <div class="ios-input-group">
      <input class="input-field" id="nicknameInput" type="text" placeholder="昵称" autocomplete="off">
    </div>
    <div class="ios-input-group">
      <input class="input-field" id="passwordInput" type="password" placeholder="密码">
    </div>
    <button class="btn-primary" id="authBtn" onclick="doAuth()">登录</button>
    <div class="error-msg" id="authError"></div>
    <div class="auth-toggle">
      <a id="authToggle" onclick="toggleAuthMode()">没有账号？点击注册</a>
    </div>

    <div class="footer">
      
      登录后不会过期 · 口令体验30分钟有效
    </div>
  </div>
</div>

<script src="/static/login.js"></script>
</body>
</html>
