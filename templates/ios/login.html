<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>语音通话</title>
<link rel="manifest" href="/static/manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="YLPhone">
<link rel="apple-touch-icon" href="/static/icon-192.png">
<meta name="theme-color" content="#007AFF">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body {
  min-height: 100%;
  background: #E5E5EA;
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", Arial, sans-serif;
  -webkit-font-smoothing: antialiased;
}
.app-container {
  background: #F2F2F7;
  width: 100%;
  max-width: 480px;
  min-height: 100vh;
  margin: 0 auto;
  display: flex;
  flex-direction: column;
  box-shadow: 0 0 20px rgba(0,0,0,0.05);
}
.content {
  flex: 1;
  padding: 0 20px;
  display: flex;
  flex-direction: column;
  margin-top: 80px;
}
.large-title {
  font-size: 34px;
  font-weight: 700;
  color: #000;
  line-height: 1.2;
  margin-bottom: 8px;
}
.subtitle {
  font-size: 15px;
  color: #8E8E93;
  margin-bottom: 32px;
}
.section-title {
  font-size: 13px;
  font-weight: 600;
  color: #8E8E93;
  text-transform: uppercase;
  letter-spacing: 0.5px;
  margin-bottom: 8px;
}
.ios-input-group {
  background: #FFFFFF;
  border-radius: 10px;
  padding: 4px 16px;
  margin-bottom: 12px;
}
.input-field {
  width: 100%;
  height: 44px;
  border: none;
  background: transparent;
  font-size: 17px;
  color: #000;
  outline: none;
  font-family: inherit;
}
.input-field::placeholder { color: #C7C7CC; }
.btn-primary {
  width: 100%;
  height: 50px;
  background: #000;
  color: #fff;
  border: none;
  border-radius: 14px;
  font-size: 17px;
  font-weight: 600;
  cursor: pointer;
  transition: opacity 0.2s;
  font-family: inherit;
}
.btn-primary:active { opacity: 0.5; }
.btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }
.btn-green {
  background: #34C759;
}
.error-msg {
  color: #FF3B30;
  font-size: 13px;
  margin-top: 8px;
  text-align: center;
  min-height: 18px;
}
.divider {
  display: flex;
  align-items: center;
  margin: 28px 0;
  gap: 12px;
}
.divider::before, .divider::after {
  content: '';
  flex: 1;
  height: 0.5px;
  background: #C6C6C8;
}
.divider span {
  font-size: 13px;
  color: #8E8E93;
  text-transform: uppercase;
}
.auth-toggle {
  text-align: center;
  margin-top: 12px;
}
.auth-toggle a {
  color: #007AFF;
  font-size: 15px;
  cursor: pointer;
  text-decoration: none;
}
.auth-toggle a:active { opacity: 0.5; }
.footer {
  text-align: center;
  font-size: 13px;
  color: #8E8E93;
  margin-top: auto;
  margin-bottom: 40px;
  padding-top: 24px;
}
.footer a {
  color: #000;
  font-weight: 500;
  text-decoration: none;
}
.hint {
  font-size: 13px;
  color: #8E8E93;
  margin-top: 8px;
  text-align: center;
}
</style>
</head>
<body>

<div class="app-container">
  <div class="content">
    <!-- 系统公告 -->
    <div id="announceBanner" style="display:none;background:#E8F4FD;border-radius:10px;padding:12px 16px;margin-bottom:16px;font-size:14px;color:#1a1a1a;position:relative">
      <span id="announceText"></span>
      <span onclick="document.getElementById('announceBanner').style.display='none'" style="position:absolute;right:10px;top:8px;cursor:pointer;font-size:18px;color:#8E8E93">&times;</span>
    </div>

    <div class="large-title">给{{ character_name }}打<br>一通电话吧</div>
    <div class="subtitle">输入口令体验，或登录账号</div>

    <!-- 口令体验区 -->
    <div class="section-title">口令体验</div>
    <div class="ios-input-group">
      <input class="input-field" id="redeemInput" type="text" placeholder="输入口令" autocomplete="off" autocorrect="off">
    </div>
    <button class="btn-primary btn-green" id="redeemBtn" onclick="doRedeem()">开始体验</button>
    <div class="error-msg" id="redeemError"></div>
    <div class="hint">从小红书获取口令，免费体验</div>

    <div class="divider"><span>或</span></div>

    <!-- 账号登录区 -->
    <div class="section-title">账号登录</div>
    <div class="ios-input-group">
      <input class="input-field" id="nicknameInput" type="text" placeholder="昵称" autocomplete="off">
    </div>
    <div class="ios-input-group">
      <input class="input-field" id="passwordInput" type="password" placeholder="密码">
    </div>
    <button class="btn-primary" id="authBtn" onclick="doAuth()">登录</button>
    <div class="error-msg" id="authError"></div>
    <div class="auth-toggle">
      <a id="authToggle" onclick="toggleAuthMode()">没有账号？点击注册</a>
    </div>

    <div class="footer">
      
      登录后不会过期 · 口令体验30分钟有效
    </div>
  </div>
</div>

<script src="/static/login.js"></script>
<script>
// 加载公告
fetch('/api/announcement').then(r=>r.json()).then(d=>{
  if(d.text){
    document.getElementById('announceText').textContent=d.text;
    document.getElementById('announceBanner').style.display='block';
  }
}).catch(()=>{});
</script>

<!-- 意见反馈浮动按钮 -->
<div onclick="document.getElementById('fbModal').style.display='flex'" style="position:fixed;bottom:20px;right:20px;background:#007AFF;color:#fff;border-radius:50%;width:48px;height:48px;display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 2px 12px rgba(0,0,0,.2);font-size:20px">💬</div>

<!-- 反馈弹窗 -->
<div id="fbModal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:999;align-items:center;justify-content:center" onclick="if(event.target===this)this.style.display='none'">
  <div style="background:#fff;border-radius:14px;padding:20px;width:85%;max-width:360px">
    <div style="font-size:16px;font-weight:600;margin-bottom:12px">意见反馈</div>
    <textarea id="fbText" placeholder="说说你的建议或遇到的问题..." style="width:100%;min-height:80px;padding:10px;border:1px solid #E5E5EA;border-radius:8px;font-size:14px;box-sizing:border-box;font-family:inherit;resize:vertical"></textarea>
    <input id="fbContact" placeholder="联系方式（选填）" style="width:100%;padding:10px;border:1px solid #E5E5EA;border-radius:8px;font-size:14px;box-sizing:border-box;margin-top:8px">
    <button onclick="submitFeedback()" style="width:100%;padding:12px;background:#007AFF;color:#fff;border:none;border-radius:10px;font-size:16px;margin-top:12px;cursor:pointer">提交</button>
    <div id="fbMsg" style="font-size:13px;color:#8E8E93;text-align:center;margin-top:8px"></div>
  </div>
</div>
<script>
function submitFeedback(){
  var text=document.getElementById('fbText').value.trim();
  if(!text){document.getElementById('fbMsg').textContent='请输入内容';return;}
  fetch('/api/feedback',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text:text,contact:document.getElementById('fbContact').value.trim()})})
  .then(r=>r.json()).then(d=>{
    if(d.ok){document.getElementById('fbMsg').textContent='感谢反馈！';document.getElementById('fbText').value='';setTimeout(()=>document.getElementById('fbModal').style.display='none',1500);}
    else document.getElementById('fbMsg').textContent=d.error||'提交失败';
  }).catch(()=>document.getElementById('fbMsg').textContent='网络错误');
}
</script>
</body>
</html>
